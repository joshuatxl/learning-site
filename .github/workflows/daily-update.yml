name: Daily AI news update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # allows dispatching deploy.yml below

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Per-article summaries are on-demand in the browser; the one Gemini call
      # here is the daily "Today in AI" brief (skipped if the key is unset).
      - name: Fetch news, age out old articles, rebuild front page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ingest.pipeline

      - name: Commit new content
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git commit -m "Auto-update news $(date +'%Y-%m-%d')"; then
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes"
          fi

      # A push made with GITHUB_TOKEN doesn't trigger other workflows,
      # so kick the deploy explicitly when there's new content.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
